<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESQ — Emergency Triage Login</title>
  <style>
    :root {
      --bg: #0F1115;
      --panel-bg: #16181D;
      --border: #2A2D35;
      --text: #F1F1F1;
      --text-muted: #8F95A3;
      --accent: #2E87F3;
      --accent-hover: #1F70D4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00E676;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text);
    }

    .login-box {
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .login-box h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      background-color: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background-color: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 1rem;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-dot"></div>
    <div class="header-title"><span style="color:#22D3EE;font-weight:800;letter-spacing:0.12em;text-shadow:0 0 12px rgba(34,211,238,0.4)">RESQ</span><span style="color:#5A5A66;margin:0 4px">-</span>EMERGENCY TRIAGE</div>
  </div>

  <div class="login-box">
    <h1>Operator Login</h1>
    
    <!-- ERROR_PLACEHOLDER -->

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">USERNAME</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
      </div>
      
      <div class="form-group">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn">Authenticate</button>
    </form>
  </div>
</body>
</html>
